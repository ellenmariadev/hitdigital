name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hitdigital
          POSTGRES_PASSWORD: hitdigital
          POSTGRES_DB: hitdigital
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hitdigital"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://hitdigital:hitdigital@localhost:5432/hitdigital
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (mypy)
        run: uv run mypy app

      - name: Migrations (alembic)
        run: uv run alembic upgrade head

      - name: Tests (pytest)
        run: uv run pytest -q
